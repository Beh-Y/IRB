<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRPF – Initialisation of R&D Project Form</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="page">
    <div class="page-header">
      <div>
        <h1>Initialisation of R&amp;D Project Form (IRPF)</h1>
        <span id="irpf-status-badge" class="status-badge"></span>
      </div>
    </div>

    <div id="status-banner" class="status-banner" hidden></div>

    <div id="activity-log" class="activity-log" hidden>
      <h2>Activity</h2>
      <ul id="activity-log-list"></ul>
    </div>

    <div id="triage-panel" class="triage-panel" hidden>
      <h2>Secretariat Review</h2>
      <p class="triage-hint">
        Route this IRPF to the IRB Member panel for review. Once they send their review back, you'll be able to
        record the final outcome.
      </p>
      <label for="triage-comment">Comment (optional)</label>
      <textarea id="triage-comment" rows="3"></textarea>

      <label>Route to IRB Members</label>
      <div id="triage-member-checkboxes" class="checkbox-group"></div>

      <div id="triage-error" class="field-error"></div>
      <div class="triage-actions">
        <button id="btn-route-to-members" type="button" class="btn btn-primary">Route to IRB Members for Review</button>
      </div>
    </div>

    <div id="voting-summary" class="activity-log" hidden>
      <h2>IRB Member Panel</h2>
      <div id="voting-tally" class="voting-tally"></div>
      <ul id="votes-list"></ul>
    </div>

    <div id="vote-form-panel" class="triage-panel" hidden>
      <h2>Cast Your Vote</h2>
      <p class="triage-hint">Voting as <strong id="voter-identity"></strong></p>
      <div class="radio-group vote-decision-group">
        <label class="radio-option"><input type="radio" name="voteDecision" value="Approve" /> Approve</label>
        <label class="radio-option"><input type="radio" name="voteDecision" value="Return" /> Return for Revision</label>
      </div>
      <label for="vote-comment">Comment</label>
      <textarea id="vote-comment" rows="3"></textarea>
      <div id="vote-error" class="field-error"></div>
      <div class="triage-actions">
        <button id="btn-cast-vote" type="button" class="btn btn-primary">Submit Vote</button>
      </div>
    </div>

    <div id="collate-panel" class="triage-panel" hidden>
      <h2>Secretariat Decision</h2>
      <p id="collate-hint" class="triage-hint"></p>
      <label for="collate-comment">Comment <span class="triage-hint-inline">(required if returning for amendments)</span></label>
      <textarea id="collate-comment" rows="3"></textarea>
      <div id="collate-error" class="field-error"></div>
      <div class="triage-actions">
        <button id="btn-approve-exemption" type="button" class="btn btn-primary">Approved for Exemption</button>
        <button id="btn-return-amendments" type="button" class="btn btn-secondary">Returned for Amendments</button>
        <button id="btn-create-ipaf" type="button" class="btn btn-secondary">To Create IPAF</button>
      </div>
    </div>

    <div id="irpf-form-container" class="form-container"></div>

    <div class="form-actions">
      <button id="btn-save" type="button" class="btn btn-secondary">Save</button>
      <button id="btn-submit" type="button" class="btn btn-primary">Submit</button>
      <button id="btn-approve" type="button" class="btn btn-primary">Approve</button>
      <button id="btn-close" type="button" class="btn btn-tertiary">Close</button>
    </div>
  </main>

  <script src="js/roles.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/refnumber.js"></script>
  <script src="js/status.js"></script>
  <script src="js/header.js"></script>
  <script src="js/irpf-schema.js"></script>
  <script src="js/irpf-form.js"></script>
  <script src="js/irpf-page.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outbox – SP IRB Process Management</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="page">
    <div id="status-banner" class="status-banner" hidden></div>

    <div class="page-header">
      <h1>Outbox</h1>
      <button id="btn-clear-outbox" type="button" class="btn btn-secondary">Clear Outbox</button>
    </div>

    <div id="outbox-content">
      <p class="triage-hint">
        Every action that would normally notify someone (a submission, a routing decision, a review, a resubmission,
        a final outcome) sends a real email and instantly queues a copy here, from the same place the send happens.
        Newest first.
      </p>

      <div class="outbox-filters">
        <label for="filter-role">Recipient</label>
        <select id="filter-role"><option value="all">All recipients</option></select>
        <label for="filter-record">Record</label>
        <select id="filter-record"><option value="all">All records</option></select>
        <label for="filter-action">Action</label>
        <select id="filter-action"><option value="all">All actions</option></select>
        <label for="filter-search">Search</label>
        <input id="filter-search" type="text" placeholder="Subject or body…" />
      </div>

      <div class="activity-log">
        <ul id="outbox-list"></ul>
      </div>
    </div>
  </main>

  <script src="js/error-guard.js"></script>
  <script src="js/roles.js"></script>
  <script src="js/email.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/status.js"></script>
  <script src="js/header.js"></script>
  <script src="js/form-utils.js"></script>
  <script src="js/outbox.js"></script>
</body>
</html>
